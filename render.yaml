services:
  - type: web
    name: sada-ips
    env: python
    region: ohio
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: sh start.sh
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: RENDER_EXTERNAL_HOSTNAME
        value: "sada-ips.onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://sada-ips.onrender.com,http://localhost:3000,http://127.0.0.1:8000"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://sada-ips.onrender.com"
      - key: JWT_ACCESS_TOKEN_LIFETIME_MINUTES
        value: "60"
      - key: JWT_REFRESH_TOKEN_LIFETIME_DAYS
        value: "7"
      - key: DATABASE_URL
        fromDatabase:
          name: sada-ips-db
          property: connectionString

databases:
  - name: sada-ips-db
    plan: free
    region: ohio
    databaseName: sada_ips
    user: sada_ips_user
    ipAllowList: []
